<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wahl</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --accent: #ff5252;
    --accent-hover: #e64545;
    --accent-active: #4caf50;
    --accent-active-hover: #43a047;
    --border: #e5e5e7;
    --shadow: rgba(0, 0, 0, 0.08);
    --input-bg: #f5f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --text-muted: #a1a1a6;
      --accent: #ff6b6b;
      --accent-hover: #ff8787;
      --accent-active: #5fd068;
      --accent-active-hover: #7ade7f;
      --border: #2c2c2e;
      --shadow: rgba(0, 0, 0, 0.4);
      --input-bg: #2a2a2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  .counter-wrap { text-align: center; margin-bottom: 32px; }
  .counter-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .counter {
    font-size: clamp(3rem, 12vw, 5rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform 0.15s ease;
  }
  .counter.bump { transform: scale(1.12); }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 24px var(--shadow);
    text-align: center;
  }
  .status {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 20px;
    min-height: 1.2em;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 16px 24px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    background: var(--accent);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button.voted { background: var(--accent-active); }
  button.voted:hover:not(:disabled) { background: var(--accent-active-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  button.secondary:hover:not(:disabled) { background: var(--input-bg); }
  .toggle-link {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
  }
  .error {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--accent);
    min-height: 1.2em;
  }
  .whoami {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  .option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    text-align: left;
  }
  .option-row span {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
  }
  .option-row button {
    width: auto;
    padding: 8px 12px;
    font-size: 0.85rem;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
  }
  .option-row button:hover:not(:disabled) { background: var(--input-bg); }
  .options-empty {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .add-row input { margin-bottom: 0; }
  .add-row button { width: auto; padding: 12px 16px; }
</style>
</head>
<body>

  <div class="counter-wrap">
    <div class="counter-label">Stimmen insgesamt</div>
    <div class="counter" id="counter">–</div>
  </div>

  <!-- Login / Registrieren -->
  <div class="card" id="authCard">
    <div class="status" id="authStatus">Anmelden</div>
    <input type="text" id="usernameInput" placeholder="Benutzername" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="Passwort" autocomplete="current-password">
    <button id="authBtn">Anmelden</button>
    <div class="toggle-link" id="toggleMode">Noch kein Konto? Registrieren</div>
    <div class="error" id="authError"></div>
  </div>

  <!-- Abstimmung -->
  <div class="card hidden" id="voteCard">
    <div class="whoami" id="whoami"></div>
    <div class="status" id="voteStatus">Wird geladen …</div>
    <button id="voteBtn" disabled>Wählen</button>
    <button class="secondary hidden" id="resetBtn">Wahl zurücksetzen</button>
    <button class="secondary" id="logoutBtn">Abmelden</button>
    <div class="error" id="voteError"></div>
  </div>

  <!-- Optionen verwalten (nur Admin) -->
  <div class="card hidden" id="optionsCard">
    <div class="status">Optionen verwalten</div>
    <div id="optionsList"></div>
    <div class="add-row">
      <input type="text" id="newOptionInput" placeholder="Neue Option">
      <button id="addOptionBtn">Hinzufügen</button>
    </div>
    <div class="error" id="optionsError"></div>
  </div>

<!-- Firebase SDK (kompatibel/v8-Syntax, einfach einzubinden) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
  // ==========================================================
  // HIER DEINE FIREBASE-KONFIGURATION EINTRAGEN
  // (Firebase Console -> Projekteinstellungen -> "Meine Apps" -> Web-App)
  // ==========================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDBTAhPnUpsdrcP51JFwqf9KDipSPQY0v4",
    authDomain: "ronkwaehler.firebaseapp.com",
    projectId: "ronkwaehler",
    storageBucket: "ronkwaehler.firebasestorage.app",
    messagingSenderId: "630791565245",
    appId: "1:630791565245:web:27d01675ac9ea322586cd4",
    measurementId: "G-PRYL4XDNV6"
  };
  // Fake-Domain, damit aus "Benutzername" intern eine E-Mail für Firebase Auth wird
  const FAKE_EMAIL_DOMAIN = "@wahl-app.local";

  // UIDs, die die Wahl zurücksetzen dürfen (aus Firebase Console -> Authentication -> Users)
  const ADMIN_UIDS = ["HCxNKxArx9alYSS5Zmd3wwrsYjQ2"];

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---- Elemente ----
  const counterEl = document.getElementById('counter');

  const authCard = document.getElementById('authCard');
  const authStatus = document.getElementById('authStatus');
  const usernameInput = document.getElementById('usernameInput');
  const passwordInput = document.getElementById('passwordInput');
  const authBtn = document.getElementById('authBtn');
  const toggleMode = document.getElementById('toggleMode');
  const authError = document.getElementById('authError');

  const voteCard = document.getElementById('voteCard');
  const whoamiEl = document.getElementById('whoami');
  const voteStatus = document.getElementById('voteStatus');
  const voteBtn = document.getElementById('voteBtn');
  const resetBtn = document.getElementById('resetBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const voteError = document.getElementById('voteError');

  const optionsCard = document.getElementById('optionsCard');
  const optionsList = document.getElementById('optionsList');
  const newOptionInput = document.getElementById('newOptionInput');
  const addOptionBtn = document.getElementById('addOptionBtn');
  const optionsError = document.getElementById('optionsError');

  let isRegisterMode = false;
  let lastCount = null;
  let currentUid = null;
  let currentlyVoted = false;
  let votesUnsub = null;
  let optionsUnsub = null;

  function sanitizeUsername(name) {
    return name.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
  }

  function usernameToEmail(name) {
    return sanitizeUsername(name) + FAKE_EMAIL_DOMAIN;
  }

  function renderCount(n) {
    if (typeof n !== 'number') return;
    if (lastCount !== null && n !== lastCount) {
      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 150);
    }
    lastCount = n;
    counterEl.textContent = n;
  }

  function renderVoteButton() {
    voteBtn.disabled = false;
    if (currentlyVoted) {
      voteBtn.textContent = 'Stimme zurückziehen';
      voteBtn.classList.add('voted');
      voteStatus.textContent = 'Du hast gewählt.';
    } else {
      voteBtn.textContent = 'Wählen';
      voteBtn.classList.remove('voted');
      voteStatus.textContent = 'Du hast noch nicht gewählt.';
    }
  }

  // ---- Auth: Anmelden / Registrieren umschalten ----
  toggleMode.addEventListener('click', () => {
    isRegisterMode = !isRegisterMode;
    authStatus.textContent = isRegisterMode ? 'Registrieren' : 'Anmelden';
    authBtn.textContent = isRegisterMode ? 'Konto erstellen' : 'Anmelden';
    toggleMode.textContent = isRegisterMode ? 'Schon ein Konto? Anmelden' : 'Noch kein Konto? Registrieren';
    authError.textContent = '';
  });

  authBtn.addEventListener('click', async () => {
    const username = usernameInput.value;
    const password = passwordInput.value;
    authError.textContent = '';

    if (sanitizeUsername(username).length < 3) {
      authError.textContent = 'Benutzername braucht mind. 3 Zeichen (nur Buchstaben, Zahlen, _ . -).';
      return;
    }
    if (password.length < 6) {
      authError.textContent = 'Passwort braucht mind. 6 Zeichen.';
      return;
    }

    authBtn.disabled = true;
    const email = usernameToEmail(username);

    try {
      if (isRegisterMode) {
        await auth.createUserWithEmailAndPassword(email, password);
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
    } catch (e) {
      authError.textContent = translateAuthError(e.code);
    } finally {
      authBtn.disabled = false;
    }
  });

  function translateAuthError(code) {
    switch (code) {
      case 'auth/email-already-in-use': return 'Dieser Benutzername ist schon vergeben.';
      case 'auth/invalid-email': return 'Ungültiger Benutzername.';
      case 'auth/weak-password': return 'Passwort zu schwach (mind. 6 Zeichen).';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'Benutzername oder Passwort falsch.';
      case 'auth/too-many-requests': return 'Zu viele Versuche, bitte kurz warten.';
      default: return 'Fehler: ' + code;
    }
  }

  logoutBtn.addEventListener('click', () => auth.signOut());

  function renderOptions(docs) {
    optionsList.innerHTML = '';
    if (docs.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'options-empty';
      empty.textContent = 'Noch keine Optionen vorhanden.';
      optionsList.appendChild(empty);
      return;
    }
    docs.forEach((doc) => {
      const data = doc.data();
      const row = document.createElement('div');
      row.className = 'option-row';

      const span = document.createElement('span');
      span.textContent = data.text || '';
      row.appendChild(span);

      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Entfernen';
      removeBtn.addEventListener('click', () => removeOption(doc.id));
      row.appendChild(removeBtn);

      optionsList.appendChild(row);
    });
  }

  async function removeOption(id) {
    optionsError.textContent = '';
    try {
      await db.collection('options').doc(id).delete();
    } catch (e) {
      optionsError.textContent = 'Entfernen fehlgeschlagen: ' + (e.message || e.code || e);
    }
  }

  addOptionBtn.addEventListener('click', async () => {
    const text = newOptionInput.value.trim();
    optionsError.textContent = '';
    if (!text) {
      optionsError.textContent = 'Bitte einen Text eingeben.';
      return;
    }
    addOptionBtn.disabled = true;
    try {
      await db.collection('options').add({
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      newOptionInput.value = '';
    } catch (e) {
      optionsError.textContent = 'Hinzufügen fehlgeschlagen: ' + (e.message || e.code || e);
    } finally {
      addOptionBtn.disabled = false;
    }
  });

  newOptionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addOptionBtn.click();
  });

  resetBtn.addEventListener('click', async () => {
    if (!currentUid || !ADMIN_UIDS.includes(currentUid)) return;
    const sure = confirm('Wirklich ALLE Stimmen löschen? Das kann nicht rückgängig gemacht werden.');
    if (!sure) return;

    resetBtn.disabled = true;
    voteError.textContent = '';
    try {
      const snap = await db.collection('votes').get();
      const docs = snap.docs;
      // In Blöcken von 500 löschen (Firestore-Limit pro Batch)
      for (let i = 0; i < docs.length; i += 500) {
        const batch = db.batch();
        docs.slice(i, i + 500).forEach(d => batch.delete(d.ref));
        await batch.commit();
      }
    } catch (e) {
      voteError.textContent = 'Zurücksetzen fehlgeschlagen: ' + (e.message || e.code || e);
    } finally {
      resetBtn.disabled = false;
    }
  });

  // ---- Auf Anmeldestatus reagieren ----
  auth.onAuthStateChanged((user) => {
    if (votesUnsub) { votesUnsub(); votesUnsub = null; }
    if (optionsUnsub) { optionsUnsub(); optionsUnsub = null; }

    if (user) {
      currentUid = user.uid;
      authCard.classList.add('hidden');
      voteCard.classList.remove('hidden');
      whoamiEl.textContent = 'Angemeldet als ' + user.email.replace(FAKE_EMAIL_DOMAIN, '');
      usernameInput.value = '';
      passwordInput.value = '';

      const isAdmin = ADMIN_UIDS.includes(user.uid);
      resetBtn.classList.toggle('hidden', !isAdmin);
      document.querySelector('.add-row').classList.toggle('hidden', !isAdmin);

      // Optionen-Karte für ALLE sichtbar, Bearbeiten nur für Admin (siehe renderOptions)
      optionsCard.classList.remove('hidden');
      optionsUnsub = db.collection('options').orderBy('createdAt', 'asc')
        .onSnapshot((snap) => renderOptions(snap.docs, isAdmin), (err) => {
          optionsError.textContent = 'Optionen konnten nicht geladen werden.';
        });

      // Live-Zähler: alle Dokumente in "votes" wo voted == true
      votesUnsub = db.collection('votes').where('voted', '==', true)
        .onSnapshot((snap) => {
          renderCount(snap.size);
          const mine = snap.docs.find(d => d.id === currentUid);
          currentlyVoted = !!mine;
          renderVoteButton();
        }, (err) => {
          voteError.textContent = 'Verbindung zur Abstimmung verloren.';
        });
    } else {
      currentUid = null;
      voteCard.classList.add('hidden');
      authCard.classList.remove('hidden');
      lastCount = null;
      counterEl.textContent = '–';
    }
  });

  voteBtn.addEventListener('click', async () => {
    if (!currentUid) return;
    voteBtn.disabled = true;
    voteError.textContent = '';
    const docRef = db.collection('votes').doc(currentUid);
    try {
      if (currentlyVoted) {
        await docRef.delete();
      } else {
        await docRef.set({ voted: true, votedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
    } catch (e) {
      voteError.textContent = 'Aktion fehlgeschlagen, bitte erneut versuchen.';
      voteBtn.disabled = false;
    }
  });
</script>

</body>
</html>
